name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr_agent:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write

    steps:
      - name: PR Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          openrouter__key: ${{ secrets.OPENROUTER_API_KEY }}

          config.model: "openrouter/free"
          config.output_run_details: "true"
          config.output_run_cost: "true"

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          pr_reviewer.publish_output_no_suggestions: "true"
          pr_reviewer.persistent_comment: "false"